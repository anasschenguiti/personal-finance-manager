{% extends "base.html" %}

{% block title %}Connexion - Finance Manager{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-chart-line"></i>
                <h1>Finance Manager</h1>
            </div>
            <h2>Connexion</h2>
            <p>Bienvenue ! Connectez-vous pour accéder à votre espace personnel.</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i>
                    Nom d'utilisateur
                </label>
                <input type="text" id="username" name="username" required 
                       placeholder="Entrez votre nom d'utilisateur">
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    Mot de passe
                </label>
                <input type="password" id="password" name="password" required 
                       placeholder="Entrez votre mot de passe">
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                <i class="fas fa-sign-in-alt"></i>
                Se connecter
            </button>
        </form>

        <div class="auth-footer">
            <p>Vous n'avez pas de compte ? 
                <a href="{{ url_for('register') }}" class="auth-link">Créer un compte</a>
            </p>
        </div>
    </div>
</div>

<style>
    .auth-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-color) 100%);
    }

    .auth-card {
        background-color: var(--background-white);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 420px;
        padding: 2.5rem;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        color: var(--primary-color);
    }

    .auth-logo i {
        font-size: 2rem;
    }

    .auth-logo h1 {
        font-size: 1.5rem;
        margin: 0;
    }

    .auth-header h2 {
        font-size: 1.75rem;
        color: var(--text-dark);
        margin-bottom: 0.75rem;
    }

    .auth-header p {
        color: var(--text-medium);
        margin-bottom: 0;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-group label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 500;
        color: var(--text-dark);
    }

    .form-group label i {
        color: var(--primary-color);
    }

    .form-group input {
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        font-size: 1rem;
        transition: var(--transition);
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .form-group input::placeholder {
        color: var(--text-light);
    }

    .auth-footer {
        margin-top: 2rem;
        text-align: center;
        color: var(--text-medium);
    }

    .auth-link {
        color: var(--primary-color);
        font-weight: 500;
        text-decoration: none;
        transition: var(--transition);
    }

    .auth-link:hover {
        color: var(--primary-dark);
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .auth-card {
            padding: 2rem;
        }

        .auth-logo i {
            font-size: 1.75rem;
        }

        .auth-logo h1 {
            font-size: 1.25rem;
        }

        .auth-header h2 {
            font-size: 1.5rem;
        }
    }
</style>
{% endblock %}
